<section class="grid gap-6 xl:grid-cols-2">
    <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-4">
            <h2 class="text-lg font-bold text-slate-900">Perbandingan Arus Kas</h2>
            <p class="mt-1 text-sm text-slate-500">{{ monthly.previous_month_label }} vs {{ monthly.month_label }}</p>
        </div>
        <div class="mx-auto w-full min-w-0"><canvas id="cashflowChart" class="block h-auto w-full max-w-full" height="240" aria-label="Grafik perbandingan arus kas"></canvas></div>
    </div>

    <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-4">
            <h2 class="text-lg font-bold text-slate-900">Realisasi Budget vs Limit</h2>
            <p class="mt-1 text-sm text-slate-500">{{ monthly.month_label }}</p>
        </div>
        {% if budgets %}
        <div class="mx-auto w-full min-w-0"><canvas id="budgetChart" class="block h-auto w-full max-w-full" height="240" aria-label="Grafik perbandingan budget"></canvas></div>
        {% else %}
        <p class="rounded-2xl bg-slate-50 py-16 text-center text-sm text-slate-500">Belum ada budget yang diatur untuk perbandingan.</p>
        {% endif %}
    </div>
</section>
