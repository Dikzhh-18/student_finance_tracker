<form method="get" action="/transactions" class="grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-5">
    <label class="text-xs font-semibold text-slate-600">Tipe<select name="type" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm"><option value="">Semua tipe</option><option value="income" {% if filters.type == 'income' %}selected{% endif %}>Pemasukan</option><option value="expense" {% if filters.type == 'expense' %}selected{% endif %}>Pengeluaran</option></select></label>
    <label class="text-xs font-semibold text-slate-600">Kategori<select name="category" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm"><option value="">Semua kategori</option>{% for cat in categories %}<option value="{{ cat }}" {% if filters.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label>
    <label class="text-xs font-semibold text-slate-600">Bulan<input type="month" name="month" value="{{ filters.month }}" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm"></label>
    <label class="text-xs font-semibold text-slate-600">Pencarian<input type="search" name="q" value="{{ filters.q }}" placeholder="Kategori/keterangan" class="mt-1 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm"></label>
    <div class="flex items-end gap-2"><button class="flex-1 rounded-xl bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-700">Filter</button><a href="/transactions" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600">Reset</a></div>
</form>
