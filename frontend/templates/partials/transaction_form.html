<section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
    <form method="post" action="{% if editing %}/transactions/{{ editing.id }}/edit{% else %}/transactions{% endif %}" class="grid gap-4 sm:grid-cols-2"><input type="hidden" name="csrf_token" value="{{ get_csrf_token(request) }}">
        <label class="text-sm font-semibold text-slate-700">Jenis transaksi<select name="type" required class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3"><option value="expense" {% if form_data.type == 'expense' %}selected{% endif %}>Pengeluaran</option><option value="income" {% if form_data.type == 'income' %}selected{% endif %}>Pemasukan</option></select></label>
        <label class="text-sm font-semibold text-slate-700">Jumlah (Rp)<input type="text" name="amount" required inputmode="decimal" placeholder="Contoh: 50000" value="{{ form_data.amount }}" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3"></label>
        <label class="text-sm font-semibold text-slate-700">Kategori<input type="text" name="category" required list="category-options" placeholder="Pilih atau ketik kategori" value="{{ form_data.category }}" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3"><datalist id="category-options">{% for cat in categories %}<option value="{{ cat }}"></option>{% endfor %}</datalist></label>
        <label class="text-sm font-semibold text-slate-700">Tanggal<input type="date" name="date" required value="{{ form_data.date }}" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3"></label>
        <label class="text-sm font-semibold text-slate-700 sm:col-span-2">Keterangan <span class="font-normal text-slate-400">(opsional)</span><input type="text" name="description" placeholder="Contoh: makan siang" value="{{ form_data.description }}" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3"></label>
        <div class="flex flex-wrap gap-3 sm:col-span-2"><button class="rounded-xl bg-indigo-600 px-5 py-3 text-sm font-bold text-white shadow-sm hover:bg-indigo-500">{% if editing %}Simpan perubahan{% else %}Simpan transaksi{% endif %}</button><a href="/transactions" class="rounded-xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50">Batal</a></div>
    </form>
</section>
