<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat akun · Student Finance</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <main class="mx-auto flex min-h-screen max-w-2xl items-center px-5 py-10">
        <section class="mx-auto w-full rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-9">
            <a href="/login" class="text-sm font-bold text-indigo-700">← Kembali ke masuk</a>
            
            <p class="mt-8 text-xs font-bold uppercase tracking-[0.18em] text-indigo-600">Mulai kelola uangmu</p>
            <h1 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900">Buat akun baru</h1>
            <p class="mt-2 text-sm text-slate-500">Data transaksi dan budget hanya dapat dilihat oleh akunmu.</p>
            
            {% if error %}
            <div class="mt-5 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/register" class="mt-7 grid gap-4 sm:grid-cols-2">
                <input type="hidden" name="csrf_token" value="{{ get_csrf_token(request) }}">
                
                <label class="text-sm font-semibold text-slate-700 sm:col-span-2">
                    Nama
                    <input type="text" name="name" required maxlength="100" autocomplete="name" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 font-normal outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
                </label>

                <label class="text-sm font-semibold text-slate-700 sm:col-span-2">
                    Email
                    <input type="email" name="email" required maxlength="254" autocomplete="email" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 font-normal outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
                </label>

                <label class="text-sm font-semibold text-slate-700">
                    Kata sandi
                    <input type="password" name="password" required minlength="10" autocomplete="new-password" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 font-normal outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
                    <span class="mt-1 block text-xs font-normal text-slate-400">Minimal 10 karakter.</span>
                </label>

                <label class="text-sm font-semibold text-slate-700">
                    Ulangi kata sandi
                    <input type="password" name="password_confirmation" required minlength="10" autocomplete="new-password" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 font-normal outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
                </label>

                <button class="mt-2 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white hover:bg-indigo-500 sm:col-span-2">Buat akun dan lanjutkan</button>
            </form>

            <p class="mt-5 text-xs leading-5 text-slate-400">Kata sandi disimpan sebagai hash, bukan teks asli. Jangan gunakan kata sandi yang sama dengan akun penting lainnya.</p>
        </section>
    </main>
</body>
</html>
