m font-semibold text-slate(7０">Ulangi kata sandi<input type("password" name("password_confirmation" required minlength("1０" autocomplete("new-password" class("mt(1.5 w-full rounded-xl border border-slate(2０ bg-slate(5０ px(3 py(3 font-normal outline-none focus:border-indigo(4０ focus:ring(2 focus:ring-indigo(1０"></label><button class("mt(2 rounded-xl bg-indigo(6０ px(4 py(3 text-sm font-bold text-white hover:bg-indigo(5０ sm:col-span(2">Buat akun dan lanjutkan</button></form><p class("mt(5 text-xs leading(5 text-slate(4０">Kata sandi disimpan sebagai hash, bukan teks asli. Jangan gunakan kata sandi yang sama dengan akun penting lainnya.</p></section></main></body></html>
