<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Masuk · Student Finance</title><link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}"></head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased"><main class="mx-auto grid min-h-screen max-w-6xl items-center gap-10 px-5 py-10 lg:grid-cols-2 lg:px-10"><section class="hidden rounded-[2rem] bg-gradient-to-br from-indigo-600 via-violet-700 to-indigo-900 p-10 text-white shadow-2xl shadow-indigo-200 lg:block"><span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-white/15 text-xl font-black">S</span><p class="mt-14 text-xs font-bold uppercase tracking-[0.2em] text-indigo-200">Student Finance</p><h1 class="mt-3 max-w-md text-4xl font-extrabold leading-tight">Keuangan lebih teratur, fokus kuliah lebih besar.</h1><p class="mt-4 max-w-sm text-sm leading-6 text-indigo-100">Catat pemasukan dan pengeluaranmu dengan aman dalam satu tempat.</p></section><section class="mx-auto w-full max-w-md"><a href="/" class="text-sm font-bold text-indigo-700">← Student Finance</a><div class="mt-8 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8"><p class="text-xs font-bold uppercase tracking-[0.18em] text-indigo-600">Selamat datang kembali</p><h2 class="mt-2 text-2xl font-extrabold text-slate-900">Masuk ke akun</h2><p class="mt-1 text-sm text-slate-500">Gunakan email dan kata sandi akunmu.</p>{% if error %}<div class="mt-5 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ get_csrf_token(request) }}"><input type="hidden" name="next" value="{{ next }}"><label class="block text-sm font-semibold text-slate-700">Email<input type="email" name="email" required autocomplete="email" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 font-normal outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"></label><label class="block text-sm font-semibold text-slate-700">Kata sandi<input type="password" name="password" required autocomplete="current-password" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 font-normal outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"></label><button class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white hover:bg-indigo-500">Masuk</button></form><p class="mt-6 text-center text-sm text-slate-500">Belum punya akun? <a href="/register" class="font-bold text-indigo-600 hover:underline">Daftar</a></p></div></section></main></body></html>
