[project]
name = "student-finance-tracker"
version = "0.1.0"
description = "Student finance tracker application"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "itsdangerous",
    "jinja2",
    "pydantic",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm install && npm run build:css"

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]